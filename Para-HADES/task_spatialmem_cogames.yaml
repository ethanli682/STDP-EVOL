# ============================================================================
# task_spatialmem_cogames.yaml -- Para-HADES run config
# ----------------------------------------------------------------------------
# Evolve a CoGameAgent policy net ("the gene") to play machina_1, warm-started
# from a behaviour-cloning net, via OpenAI-ES, scored by a DECOUPLED CoGameAgent
# scorer subprocess (task_spatialmem_cogames.py never imports game code).
#
# Primary genome  : SpatialMemNet, 928764 float32 weights.
# Fallback genome : AttnSubgoalNet (flat), 448652 weights -- to switch, set
#                   param.genome.array: [448652] AND scorer.net: flat.
# ============================================================================

param:
  # ONE 'array' variable = the flat policy-net gene: state_dict keys sorted by
  # NAME, each tensor flattened row-major, concatenated as float32. This matches
  # CoGameAgent scripts/stage_b/contest_spatialmem.py:net_to_gene exactly.
  genome:
    type: float
    array: [928764]          # SpatialMemNet TOTAL_PARAMS (flat: 448652)
    name: genome             # must equal scorer.gene_var below
    # ---- BOUNDS (work order §4) --------------------------------------------
    # Para-HADES maps weight -> gene as gene = weight / B (bounds are symmetric
    # -B..+B, geneMin=-1). So B MUST be >= max|weight| of the warm-start net or
    # the warm-start gets CLIPPED and corrupted. Formula (§4):
    #     B = max(3.0, 1.5 * max|weight|)
    #
    # !!! PLACEHOLDER !!!  The primary SpatialMemNet (928764) is NOT YET TRAINED
    # (results/2026-07-16-archB-spatialmem/ has only prereg.json). B=22.0 below
    # is a stand-in that covers the two FLAT nets that DO exist on disk
    # (max_abs 11.99 -> B 17.99 ; 14.55 -> B 21.83). BEFORE ANY REAL RUN:
    #     python3 compute_bounds.py <archB spatialmem net.pt>
    # and paste its min/max here. Acceptance §7.1 (codec round-trip) and §7.2
    # (warm-start gen-0 fitness == BC ceiling) on the real net WILL catch a
    # wrong B, so do not skip them.
    #
    # CAVEAT to raise with the PI: for this net family max|weight| (~12-14.6) is
    # a lone OUTLIER; 99.7% of weights lie within +-0.9 (3*std, std~0.30). The
    # §4 formula therefore inflates B to ~18-22, and §5's sigma=0.02 becomes
    # 0.02*B ~= 0.36-0.44 in WEIGHT space -- LARGER than the weight std (0.30).
    # A first ES step would then perturb typical weights by more than their own
    # magnitude. Consider either a smaller sigma (~0.002-0.005) or clipping the
    # outlier so B tracks the bulk scale. Left at the §4/§5 spec here; flagged.
    min: -22.0
    max: 22.0
    default:

# ---- decoupled CoGameAgent scorer (run_task subprocesses this) --------------
# Every field defaults inside task_spatialmem_cogames.py to the §1 contract;
# they are made explicit here so a run is fully reproducible from one file.
scorer:
  python:    python3
  module:    scripts.stage_b.parahades_score      # python3 -m <module>
  repo_path: /cluster/tufts/levinlab/hhazan01/git_repo/CoGameAgent
  extra_pythonpath: /cluster/tufts/levinlab/hhazan01/git_repo/CoGameAgent/.cluster_pylibs
  net:      spatialmem        # spatialmem (928764) | flat (448652)
  fitness:  ceiling           # ceiling = all-8 same-policy team score (default, §3)
                              # league  = leave-one-out marginal vs baseline (switch
                              #           only after ceiling clears ~1.3 past teacher)
  board:    machina_1
  seeds:    "42,43,44,45,46"  # 5 seeds, mean (§0)
  steps:    10000
  n_miners: 4
  gene_var: genome            # must match the param: key above
  timeout_s: 0                # 0 = no per-eval timeout

main:
  # Per ES eval worker: 1 core, single-threaded (Salimans-ES convention, §0/§6).
  Task_resource:
    type: CPU
    gpu: 0
    cpu: 1
    memory: '8GB'
    time: '00-03:59:59'
    conda_env: 'base'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Task'
    singularity_image: '/cluster/tufts/levinlab/hhazan01/singularity/mettagrid.sif'
    extra_pythonpath: '/cluster/tufts/levinlab/hhazan01/git_repo/CoGameAgent:/cluster/tufts/levinlab/hhazan01/git_repo/CoGameAgent/.cluster_pylibs'
  # Master: candidate generation (OpenAI-ES) + result collection.
  Main_resource:
    type: CPU
    gpu: 0
    cpu: 4
    memory: '32GB'
    time: '00-23:59:59'
    conda_env: 'base'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Agent'
    singularity_image: '/cluster/tufts/levinlab/hhazan01/singularity/mettagrid.sif'
    extra_pythonpath: '/cluster/tufts/levinlab/hhazan01/git_repo/CoGameAgent:/cluster/tufts/levinlab/hhazan01/git_repo/CoGameAgent/.cluster_pylibs'

# ---- OpenAI-ES backend (build_in_params['OpenAI_ES'], work order §5) --------
# Reaches the ES via GA_class.bulidin_params(), which merges this ML block into
# each candidate's build_in_param (GA_class.py:308).
ML:
  OpenAI_ES:
    scaler_type: rank            # centered-rank fitness normalization (§5)
    sigma: 0.02                  # gene-space std (= 0.02*B in weight space) -- see
                                 # the outlier CAVEAT above; revisit vs the real B.
    learning_rate: auto          # Adam auto lr (§5)
    use_mirroring: true          # mirrored / antithetic sampling: 128 -> 64 pairs (§5)
    random_injection_rate: 0.0   # warm-start: NO random ~1e6-dim genes (hopeless;
                                 # generateRandomGene would emit weights ~N(0,B/3))
    sigma_decay: 0.999           # per-iteration self-decay (§5)
    adam_beta1: 0.9
    adam_beta2: 0.999
