param:
  i2h:
    min: -50.0
    max: 50.0
    type: float
    # round: 
    array: [11760] # 784 x 15
    name: Input_to_Hidden
    default: 

  h2o:
    min: -50.0
    max: 50.0
    type: float
    # round: 
    array: [150] # 15 x 10
    name: Hidden_to_Output
    default: 

main:
  Task_resource:
    type: CPU
    gpu: 0
    cpu: 4
    theadsPerCore: 2
    memory: '32GB'
    time: '00-23:59:59'
    conda_env: 'delayW'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Task'

  Main_resource:
    type: CPU
    gpu: 0
    cpu: 24
    theadsPerCore: 2
    memory: '64GB'
    time: '00-23:59:59'
    conda_env: 'delayW'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Agent'

ML:
    RevFF_predictor:
        use_log_scaler: True
        top_k_percentile: 40
        ANN_Layers_size: [64, 32, 32, 16]
        dropout_rate: 0.2
        epochs: 300
        batch_size: 16
        learning_rate: 0.001
        early_stop_threshold: 0.05

        min_epochs_before_early_stop: 10
        validation: False
        validation_split: 0.2
        # gradient_clip: None
        buffer_multiplier: 2        
        allowed_architectures: ['ANN', 'CNN1D', 'CNN2D']
        max_models_to_train: 1

    CMA_ES:
        scaler_type: rank
        use_smoothing: True
        diag_mode: auto
        diag_mode_threshold: 4096
        max_full_cov_gib: 32.0
        
    GA:
        mutation_rate: 0.1
        sigma: 0.1
        crossover_prob: 0.5
        
    SNES:
        scaler_type: rank
        lr_mu: 1.0
        lr_sigma: 1.0
        
    DiffEvo:
        # Unconditional Diffusion Evolution (GA_class_DiffEvo_Claude.py)
        num_steps: 25                # Denoising steps (T)
        noise_scale: 0.5             # Mutation magnitude σ_m
        latent_dim: auto             # Random projection dimension (auto, or int)
        alpha_schedule: cosine       # Schedule type (cosine, linear)
        top_k_percentile: 40         # What % to load
        pool_size: auto              # Max population size (auto, or int)
        min_datapoints: None         # Min genes to load
        use_scaler: True             # Use fitness scaler

       
    HADES:
      # Shared parameters (used by both Gemini and Claude conditional diffusion)
      use_log_scaler: True
      top_k_percentile: 40
      hidden_dims: [1024, 512, 256]   # Smaller MLP to keep RAM use reasonable on 64GB CPU nodes
      diffusion_steps: 300
      learning_rate: 0.001
      weight_decay: 0.00001
      batch_size: 16                  # Lighter batches to further reduce peak memory
      max_epochs: 20                  # Keeps a similar training budget without the 300-epoch default
      model_type: 'VAE'               # 'VAE' or 'MLP' <--- The Toggle
      latent_dim: 256                 # Smaller latent to trim model size
      vae_epochs_ratio: 0.3           # 30% of epochs for VAE pre-training

        
    # Fine-tuning controls (shared)
    use_finetuning: True
    finetune_lr_scale: 0.5
    finetune_epoch_scale: 0.5
    finetune_min_epochs: 150
    finetune_every_n_gens: 1
    finetune_decay: 0.95
    checkpoint_dir: running
    
    # Claude-specific parameters (GA_class_CondEvo_Claude.py)
    conditions: [fitness]
    custom_conditions: {}
    exploration_mode: adaptive   # adaptive, random, greedy
    exploration_noise: 0.1
    mutation_rate: 0.1
    use_model_cache: True
    force_retrain: False
    validation_split: 0.1
            
    # Gemini-specific parameters (GA_class_CondEvo_Gemini.py)
    layers: 6
    dropout: 0.1
    inference_steps: 50
    guidance_scale: 4.0
    fitness_embedding_scale: 1.0
