main:
  StaticEval:
    # SMOKE matched to task_cogames_static_smoke.yaml so per-eval wallclock
    # is comparable. CMA-ES static_smoke vs random-search smoke is the
    # synthesis-#2 diagnostic: if CMA-ES doesn't beat random search on
    # aggregate score OR any decomposed component, the optimizer is
    # ranking on noise.
    mission: arena
    num_agents: 4
    fitness_stat: composite_v5_role_event
    eval_episodes: 5
    seed_base: 12345
    render: False
    hidden: [64, 32]
    obs_mode: legacy_flat
    frame_stack: 5
    grid_h: 11
    grid_w: 11
    num_channels: 3
    global_state_dim: 70
    fitness_v5:
      w_F_heart:        5.0
      w_F_chest:        5.0
      w_F_ep:           3.0
      w_B_ach_ore:      0.3
      w_B_ach_gear:     0.5
      w_B_role_events:  0.2
      w_B_explore:      0.4
      w_B_init:         0.0
      score_B_cap:      3.0
      reduction:        max
