param:
  # ------------------------------------------------------------------ #
  # Each synaptic pathway evolves its CONNECTION SPARSITY (the probability
  # that a synapse exists, 0..1), not its full weight matrix -- the dense
  # matrices (up to 1,000,000 values) were too large to evolve.
  #
  # dot_tracingtask.py builds each mask as `fixed_uniform_draw < sparsity`,
  # so raising a gene only adds synapses and the existing ones stay put. The
  # weight values inside a mask are fixed random draws from --seed, scaled by
  # the per-pathway scaler_* genes below.
  #
  # Previous hand-set values, for reference: gc_pc 0.05, pc_ac 0.10,
  # ac_mc 0.20, rec 1.0 (dense).
  # ------------------------------------------------------------------ #

  # ---- GRID CELL -> PLACE CELL (agent / target) ---------------------- #
  sparsity_gc_pc_a:
    type: float
    array: [1]
    name: GC_to_PC_A
    round: 4
    min: 0.0
    max: 0.5
    coevo_group: gc_pc_a
  sparsity_gc_pc_t:
    type: float
    array: [1]
    name: GC_to_PC_T
    round: 4
    min: 0.0
    max: 0.5
    coevo_group: gc_pc_t

  # ---- PLACE CELL -> ASSOCIATION (agent / target) -------------------- #
  sparsity_pc_ac_a:
    type: float
    array: [1]
    name: PC_A_to_AC
    round: 4
    min: 0.0
    max: 0.5
    coevo_group: pc_ac_a
  sparsity_pc_ac_t:
    type: float
    array: [1]
    name: PC_T_to_AC
    round: 4
    min: 0.0
    max: 0.5
    coevo_group: pc_ac_t

  # ---- ASSOCIATION recurrent reservoir (signed randn weights) -------- #
  sparsity_rec:
    type: float
    array: [1]
    name: AC_to_AC
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: rec

  # ---- ASSOCIATION -> MOTOR, the plastic pathway --------------------- #
  # Existing synapses start at --ac_mc_init * scaler_ac_mc; MSTDPET learns them.
  sparsity_ac_mc:
    type: float
    array: [1]
    name: AC_to_MC
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: ac_mc

  # ---- MOTOR opponent inhibition ------------------------------------- #
  # One sparsity per directed opponent block: (up->down, down->up,
  # right->left, left->right). The (negative) weight is scaler_inhib_mc.
  sparsity_mc_opp:
    type: float
    array: [4]
    name: MC_opponent
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: mc_opp

  # ---- per-pathway scalers (untagged -> the shared '_default' group) --- #
  scaler_gc_pc1: 
    type: float
    array: [1]
    name: gc_pc1
    min: 0.0
    max: 3.0
  scaler_gc_pc2: 
    type: float
    array: [1]
    name: gc_pc2
    min: 0.0
    max: 3.0
  scaler_pc_ac1: 
    type: float
    array: [1]
    name: pc_ac1
    min: 0.0
    max: 3.0
  scaler_pc_ac2: 
    type: float
    array: [1]
    name: pc_ac2
    min: 0.0
    max: 3.0
  scaler_ac_mc: 
    type: float
    array: [1]
    name: ac_mc
    min: 0.0
    max: 3.0
  scaler_inhib_ac: 
    type: float
    array: [1]
    name: inhib_ac
    min: 0.0
    max: 3.0
  scaler_inhib_mc: 
    type: float
    array: [1]
    name: inhib_mc
    min: -3.0
    max: 0.0
  

main:
  Task_resource:
    type: CPU
    gpu: 0
    cpu: 24
    theadsPerCore: 2
    memory: '64GB'
    time: '00-23:59:59'
    conda_env: 'delayW'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Task'

  Main_resource:
    type: CPU
    gpu: 0
    cpu: 24
    theadsPerCore: 2
    memory: '64GB'
    time: '00-23:59:59'
    conda_env: 'delayW'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Agent'

# Only needed for inheritance: lamarckian. The hook receives each reportParam
# and can copy evolved values back into reportParam['gene'].
# post_fitness_hook:
#   module:   dot_tracing_hooks
#   function: lamarckian_writeback

ML:
    # -------------------------------------------------------------------
    # OpenAI-ES is the closest relative of the paper's EVOL: both are
    # Salimans et al. style, mean-centred, fitness-weighted, no truncation
    # selection -- every offspring contributes, including a negative-weighted
    # term for below-average ones.
    #
    # Differences worth knowing: Para-HADES adds Adam, rank scaling, mirrored
    # sampling and sigma decay. The paper's alpha = 1.0 is the coefficient of a
    # plain ES step, NOT an Adam learning rate, so it does not transfer -- do
    # not set learning_rate: 1.0. sigma = 0.1 IS the paper's value.
    # -------------------------------------------------------------------
    OpenAI_ES:
        scaler_type: rank
        learning_rate: auto     # per-group; auto clips to [0.003, 0.08]
        sigma: 0.1              # the paper's perturbation scale
        adam_beta1: 0.9
        adam_beta2: 0.999
        use_mirroring: True
        sigma_decay: 0.999      # the paper uses NO decay; set 1.0 to match
        random_injection_rate: 0.15
        stagnation_window: 15
        sigma_boost_factor: 2.0

    CMA_ES:
        scaler_type: rank
        use_smoothing: True
        diag_mode: auto
        diag_mode_threshold: 4096
        max_full_cov_gib: 32.0

    SNES:
        scaler_type: rank
        lr_mu: 1.0
        lr_sigma: 1.0

    GA:
        mutation_rate: 0.1
        sigma: 0.1
        crossover_prob: 0.5
        scaler_type: rank