
param:
  # acmc pathway is evolved along with scalars for all weights
  w_ac_mc:
    type: float
    array: [5000]
    name: AC_to_MC
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: ac_mc
  scaler_gc_pc1: 
    type: float
    array: [1]
    name: gc_pc1
    min: 0.0
    max: 5.0
  scaler_gc_pc2: 
    type: float
    array: [1]
    name: gc_pc2
    min: 0.0
    max: 5.0
  scaler_pc_ac1: 
    type: float
    array: [1]
    name: pc_ac1
    min: 0.0
    max: 5.0
  scaler_pc_ac2: 
    type: float
    array: [1]
    name: pc_ac2
    min: 0.0
    max: 5.0
  scaler_ac_mc: 
    type: float
    array: [1]
    name: ac_mc
    min: 0.0
    max: 5.0
  scaler_inhib_ac: 
    type: float
    array: [1]
    name: inhib_ac
    min: 0.0
    max: 5.0
  scaler_inhib_mc: 
    type: float
    array: [1]
    name: inhib_mc
    min: -5.0
    max: 0.0
  scaler_gc_pc1S: 
    type: float
    array: [1]
    name: gcpc1S
    min: 0.0
    max: 1.0
  scaler_gc_pc2S: 
    type: float
    array: [1]
    name: gcpc2S
    min: 0.0
    max: 1.0
  scaler_pc_ac1S: 
    type: float
    array: [1]
    name: pcac1S
    min: 0.0
    max: 1.0
  scaler_pc_ac2S: 
    type: float
    array: [1]
    name: pcac2S
    min: 0.0
    max: 1.0
  scaler_ac_mcS: 
    type: float
    array: [1]
    name: acmcS
    min: 0.0
    max: 1.0

# Two-phase schedule, read by GA.py and handed to dot_task.py via
# <path>/motor_phase.json (the live phase is stored there, so a resumed run keeps
# its phase).
#   sparsity: motor_params are pinned to one fixed random value in every
#             candidate, so the GA only moves the GC/PC/AC genes. Fitness is how
#             close the AC active fraction is to ac_target.
#   motor:    entered the first time any candidate lands inside ac_target. Every
#             gene is evolved, fitness is the task reward, and each candidate's
#             weights are saved to weights.pt in its dotTracing_out folder.
phases:
  motor_params: [w_ac_mc, scaler_ac_mc, scaler_ac_mcS, scaler_inhib_mc]
  ac_target: [0.25, 0.65]     # fraction of AC neurons active per step
  sparsity:
    trn_eps: 1
    tst_eps: 0
  motor:
    trn_eps: 25
    tst_eps: 10
    save_weights: True
    # fitness -= penalty * distance outside ac_target, so the AC layer can't
    # drift back to silent once the motor genes start moving
    ac_penalty: 10.0

main:
  Task_resource:
    type: CPU
    gpu: 0
    cpu: 64
    theadsPerCore: 2
    memory: '16GB'
    time: '00-23:59:59'
    conda_env: 'Para-HADES'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Task'

  Main_resource:
    type: CPU
    gpu: 0
    cpu: 32
    theadsPerCore: 2
    memory: '16GB'
    time: '00-23:59:59'
    conda_env: 'Para-HADES'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Agent'

# Only needed for inheritance: lamarckian. The hook receives each reportParam
# and can copy outP['gene_out_w_ac_mc'] back into reportParam['gene'].
# post_fitness_hook:
#   module:   dot_tracing_hooks
#   function: lamarckian_writeback

ML:
    # -------------------------------------------------------------------
    # OpenAI-ES is the closest relative of the paper's EVOL: both are
    # Salimans et al. style, mean-centred, fitness-weighted, no truncation
    # selection -- every offspring contributes, including a negative-weighted
    # term for below-average ones.
    #
    # Differences worth knowing: Para-HADES adds Adam, rank scaling, mirrored
    # sampling and sigma decay. The paper's alpha = 1.0 is the coefficient of a
    # plain ES step, NOT an Adam learning rate, so it does not transfer -- do
    # not set learning_rate: 1.0. sigma = 0.1 IS the paper's value.
    # -------------------------------------------------------------------
    OpenAI_ES:
        scaler_type: rank
        learning_rate: auto     # per-group; auto clips to [0.003, 0.08]
        sigma: 0.1              # the paper's perturbation scale
        adam_beta1: 0.9
        adam_beta2: 0.999
        use_mirroring: True
        sigma_decay: 0.999      # the paper uses NO decay; set 1.0 to match
        random_injection_rate: 0.15
        stagnation_window: 15
        sigma_boost_factor: 2.0

    CMA_ES:
        scaler_type: rank
        use_smoothing: True
        diag_mode: auto
        diag_mode_threshold: 4096
        max_full_cov_gib: 32.0

    SNES:
        scaler_type: rank
        lr_mu: 1.0
        lr_sigma: 1.0

    GA:
        mutation_rate: 0.1
        sigma: 0.1
        crossover_prob: 0.5
        scaler_type: rank