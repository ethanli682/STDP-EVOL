param:
  # ------------------------------------------------------------------ #
  # Each synaptic pathway evolves its CONNECTION SPARSITY (the probability
  # that a synapse exists, 0..1), not its full weight matrix -- the dense
  # matrices (up to 1,000,000 values) were too large to evolve.
  #
  # dot_tracingtask.py builds each mask as `fixed_uniform_draw < sparsity`,
  # so raising a gene only adds synapses and the existing ones stay put. The
  # weight values inside a mask are fixed random draws from --seed, scaled by
  # the per-pathway scaler_* genes below.
  #
  # Previous hand-set values, for reference: gc_pc 0.05, pc_ac 0.10,
  # ac_mc 0.20, rec 1.0 (dense).
  # ------------------------------------------------------------------ #

  # todo pass in stdp param
  # evolve one layer at a time 50% +- 10
  # create plots for the fitness over time

  # give the tc_decay, tc_trace

  # ---- per-pathway scalers (untagged -> the shared '_default' group) --- #
  scaler_gc_pc1: 
    type: float
    name: gc_pc1
    min: 0.0
    max: 5.0
  scaler_gc_pc2: 
    type: float
    name: gc_pc2
    min: 0.0
    max: 5.0 
  tc_decay:
    type: float
    name: tc_decay
    min: 20.0
    max: 100.0
  tc_trace:
    type: float
    name: tc_trace
    min: 20.0
    max: 100.0
