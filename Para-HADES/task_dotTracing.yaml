param:
  # ------------------------------------------------------------------ #
  # EVERY synaptic weight matrix in the network is a gene, followed by a
  # per-pathway scaler. Sizes below are for the dot_tracingtask.py parser
  # DEFAULTS, which are the single source of truth for the architecture:
  #
  #   n_gc  = len(gc_scales) * 7 rotations * 16 phases = 5*7*16 = 560
  #   n_pc  = 500        (per place layer, two layers)
  #   ac    = 1000
  #   moveChoices = 5    (9 when --diag True)
  #   mc_pop = 100  ->  n_mc = moveChoices * mc_pop = 500
  #
  # Each weight gene is the DENSE matrix, flattened row-major (C order).
  # dot_tracingtask.py reshapes it and then applies the fixed connectivity
  # mask, so entries that fall outside the mask are inert -- that keeps the
  # gene length a constant the YAML can state, instead of depending on which
  # synapses a particular mask seed happened to open.
  #
  # If you change any of the architecture defaults in dot_tracingtask.py you
  # MUST update the matching `array:` here; the task raises a ValueError that
  # names the expected length rather than silently mis-shaping a matrix.
  # ------------------------------------------------------------------ #

  # ---- GRID CELL -> PLACE CELL (agent / target), 560 x 500 = 280000 ---- #
  w_gc_pc_a:
    type: float
    array: [280000]
    name: GC_to_PC_A
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: gc_pc_a
  w_gc_pc_t:
    type: float
    array: [280000]
    name: GC_to_PC_T
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: gc_pc_t

  # ---- PLACE CELL -> ASSOCIATION (agent / target), 500 x 1000 = 500000 -- #
  w_pc_ac_a:
    type: float
    array: [500000]
    name: PC_A_to_AC
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: pc_ac_a
  w_pc_ac_t:
    type: float
    array: [500000]
    name: PC_T_to_AC
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: pc_ac_t

  # ---- ASSOCIATION recurrent reservoir, 1000 x 1000 = 1000000 ---------- #
  # Signed: the reservoir replaces a randn() draw, so it needs both halves.
  # The diagonal is zeroed by the task, whatever the gene says.
  w_rec:
    type: float
    array: [1000000]
    name: AC_to_AC
    round: 4
    min: -1.0
    max: 1.0
    coevo_group: rec

  # ---- ASSOCIATION -> MOTOR, the plastic pathway --------------------- #
  # One value per (AC neuron, ACTION) = 1000 * 5 = 5000, broadcast across the
  # mc_pop neurons of each action. A full per-synapse gene (1000 * 500 =
  # 500000) is also accepted by the task if you widen `array:` to that.
  w_ac_mc:
    type: float
    array: [5000]
    name: AC_to_MC
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: ac_mc

  # ---- MOTOR opponent inhibition ------------------------------------- #
  # One magnitude per directed opponent block: (up->down, down->up,
  # right->left, left->right). Magnitudes are non-negative; the sign comes
  # from scaler_inhib_mc, which the YAML pins to [-5, 0].
  w_mc_opp:
    type: float
    array: [4]
    name: MC_opponent
    round: 4
    min: 0.0
    max: 1.0
    coevo_group: mc_opp

  # ---- per-pathway scalers (untagged -> the shared '_default' group) --- #
  scaler_gc_pc1: 
    type: float
    array: [1]
    name: gc_pc1
    min: 0.0
    max: 5.0
  scaler_gc_pc2: 
    type: float
    array: [1]
    name: gc_pc2
    min: 0.0
    max: 5.0
  scaler_pc_ac1: 
    type: float
    array: [1]
    name: pc_ac1
    min: 0.0
    max: 5.0
  scaler_pc_ac2: 
    type: float
    array: [1]
    name: pc_ac2
    min: 0.0
    max: 5.0
  scaler_ac_mc: 
    type: float
    array: [1]
    name: ac_mc
    min: 0.0
    max: 5.0
  scaler_inhib_ac: 
    type: float
    array: [1]
    name: inhib_ac
    min: 0.0
    max: 5.0
  scaler_inhib_mc: 
    type: float
    array: [1]
    name: inhib_mc
    min: -5.0
    max: 0.0
  

main:
  Task_resource:
    type: CPU
    gpu: 0
    cpu: 24
    theadsPerCore: 2
    memory: '64GB'
    time: '00-23:59:59'
    conda_env: 'delayW'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Task'

  Main_resource:
    type: CPU
    gpu: 0
    cpu: 24
    theadsPerCore: 2
    memory: '64GB'
    time: '00-23:59:59'
    conda_env: 'delayW'
    partition: 'preempt'
    exclude_nodes: ''
    path: '/logs_Agent'

# Only needed for inheritance: lamarckian. The hook receives each reportParam
# and can copy outP['gene_out_w_ac_mc'] back into reportParam['gene'].
# post_fitness_hook:
#   module:   dot_tracing_hooks
#   function: lamarckian_writeback

ML:
    # -------------------------------------------------------------------
    # OpenAI-ES is the closest relative of the paper's EVOL: both are
    # Salimans et al. style, mean-centred, fitness-weighted, no truncation
    # selection -- every offspring contributes, including a negative-weighted
    # term for below-average ones.
    #
    # Differences worth knowing: Para-HADES adds Adam, rank scaling, mirrored
    # sampling and sigma decay. The paper's alpha = 1.0 is the coefficient of a
    # plain ES step, NOT an Adam learning rate, so it does not transfer -- do
    # not set learning_rate: 1.0. sigma = 0.1 IS the paper's value.
    # -------------------------------------------------------------------
    OpenAI_ES:
        scaler_type: rank
        learning_rate: auto     # per-group; auto clips to [0.003, 0.08]
        sigma: 0.1              # the paper's perturbation scale
        adam_beta1: 0.9
        adam_beta2: 0.999
        use_mirroring: True
        sigma_decay: 0.999      # the paper uses NO decay; set 1.0 to match
        random_injection_rate: 0.15
        stagnation_window: 15
        sigma_boost_factor: 2.0

    CMA_ES:
        scaler_type: rank
        use_smoothing: True
        diag_mode: auto
        diag_mode_threshold: 4096
        max_full_cov_gib: 32.0

    SNES:
        scaler_type: rank
        lr_mu: 1.0
        lr_sigma: 1.0

    GA:
        mutation_rate: 0.1
        sigma: 0.1
        crossover_prob: 0.5
        scaler_type: rank